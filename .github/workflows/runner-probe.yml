name: Runner probe (temporal)
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          echo "label: ${{ matrix.os }}"
          uname -m
          sw_vers
          xcodebuild -version || true
